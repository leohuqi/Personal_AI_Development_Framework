<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="component-ports-title component-ports-desc" id="component-ports-root"><title id="component-ports-title">Module components and ports</title><desc id="component-ports-desc">Compile dependencies/calls shown. All adapters also depend on Domain; App wiring and UI DesignSystem remain in the approved SYSTEM topology. Six named ports are expanded in INTERFACES.swift.txt, not six new packages.</desc><defs>
      <style>#component-ports-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #component-ports-root p, #component-ports-root li { line-height:1.6;max-width:95ch }
      #component-ports-root a { color:#2e5aa8 }
      #component-ports-root nav { display:flex;gap:16px;flex-wrap:wrap }
      #component-ports-root .diagram-container { width:100%;overflow-x:auto }
      #component-ports-root .node-name { font:600 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #component-ports-root .sub { font:14px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #component-ports-root .tag { font:12px 'Geist Mono',ui-monospace,monospace;fill:#5a6580;letter-spacing:1px }
      #component-ports-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5 }
      #component-ports-root .label { font:13px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #component-ports-root section { margin:36px 0;border-top:1px solid #ccd0d7;padding-top:24px }
      #component-ports-root table { border-collapse:collapse;width:100% }
      #component-ports-root th, #component-ports-root td { padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #ccd0d7 }
      #component-ports-root pre { overflow:auto;background:#ececec;padding:18px;font:13px/1.5 ui-monospace,monospace }
      #component-ports-root summary { cursor:pointer }
      #component-ports-root .diagram-container { overflow:visible }
      #component-ports-root nav { display:none }
      #component-ports-root section { break-inside:avoid }</style><marker id="component-ports-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line class="edge" x1="244" y1="300" x2="304" y2="300" marker-end="url(#component-ports-arrow)"/><rect x="249.2" y="266" width="49.6" height="24" fill="#f5f5f5"/><text x="274" y="280" class="label" text-anchor="middle">CALL</text><path class="edge" d="M 560,280 H 604 Q 612,280 612,272 V 180 Q 612,172 620,172 H 672" marker-end="url(#component-ports-arrow)"/><path class="edge" d="M 560,328 H 596 Q 604,328 604,336 V 484 Q 604,492 612,492 H 672" marker-end="url(#component-ports-arrow)"/><line class="edge" x1="1000" y1="492" x2="912" y2="492" marker-end="url(#component-ports-arrow)"/><rect x="906.0" y="458" width="100.0" height="24" fill="#f5f5f5"/><text x="956" y="472" class="label" text-anchor="middle">IMPLEMENTS</text><g data-node="presentation"><rect class="node-box" x="48" y="256" width="196" height="112" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="64" y="280" class="tag" text-anchor="start">COMPONENT</text><text x="64" y="308" class="node-name" text-anchor="start">Presentation</text><text x="64" y="336" class="sub" text-anchor="start">MainActor state</text></g><g data-node="usecases"><rect class="node-box" x="304" y="256" width="256" height="128" rx="6" fill="#f8ece7" stroke="#bf4520"/><text x="320" y="280" class="tag" text-anchor="start">COMPONENT</text><text x="320" y="308" class="node-name" text-anchor="start">ExpenseUseCases</text><text x="320" y="336" class="sub" text-anchor="start">ImportCoordinator</text><text x="320" y="358" class="sub" text-anchor="start">coordinates all writes</text></g><g data-node="domain"><rect class="node-box" x="672" y="116" width="240" height="112" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="688" y="140" class="tag" text-anchor="start">COMPONENT</text><text x="688" y="168" class="node-name" text-anchor="start">LedgerDomain</text><text x="688" y="196" class="sub" text-anchor="start">Money / IdentityPolicy</text></g><g data-node="ports"><rect class="node-box" x="672" y="436" width="240" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="688" y="460" class="tag" text-anchor="start">COMPONENT</text><text x="688" y="488" class="node-name" text-anchor="start">Application ports</text><text x="688" y="516" class="sub" text-anchor="start">LedgerStore / Import</text><text x="688" y="538" class="sub" text-anchor="start">Category / Location</text><text x="688" y="560" class="sub" text-anchor="start">Identity / Maintenance</text></g><g data-node="adapters"><rect class="node-box" x="1000" y="416" width="232" height="180" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="1016" y="440" class="tag" text-anchor="start">COMPONENT</text><text x="1016" y="468" class="node-name" text-anchor="start">Approved adapters</text><text x="1016" y="496" class="sub" text-anchor="start">CoreData / BillImport</text><text x="1016" y="518" class="sub" text-anchor="start">Rules / CoreLocation</text><text x="1016" y="540" class="sub" text-anchor="start">IdentityVault / Archive</text></g><text x="48" y="84" class="node-name" text-anchor="start">One process. No adapter-to-adapter imports. No HTTP.</text><text x="48" y="628" class="sub" text-anchor="start">Ports and use cases live in LedgerApplication; composition wires concrete adapters.</text><line class="edge" x1="40" y1="652" x2="1240" y2="652"/><text x="40" y="684" class="tag" text-anchor="start">EXPENSE RECORD · ARCHITECTURE</text><text x="1240" y="684" class="sub" text-anchor="end">Source contracts define complete behavior</text></svg>
