<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="source-identity-title source-identity-desc" id="source-identity-root"><title id="source-identity-title">Immutable source identity and receipts</title><desc id="source-identity-desc">Subset of logical model: namespace owns identities; identity has observations; observations belong to one entry/batch; command optionally belongs to one batch. Additional namespace-to-observation/batch and Entry-to-identity relations are explicit in JSON, omitted here to avoid crossing. No raw provider IDs or files persist.</desc><defs>
      <style>#source-identity-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #source-identity-root p, #source-identity-root li { line-height:1.6;max-width:95ch }
      #source-identity-root a { color:#2e5aa8 }
      #source-identity-root nav { display:flex;gap:16px;flex-wrap:wrap }
      #source-identity-root .diagram-container { width:100%;overflow-x:auto }
      #source-identity-root .node-name { font:600 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #source-identity-root .sub { font:14px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #source-identity-root .tag { font:12px 'Geist Mono',ui-monospace,monospace;fill:#5a6580;letter-spacing:1px }
      #source-identity-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5 }
      #source-identity-root .label { font:13px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #source-identity-root section { margin:36px 0;border-top:1px solid #ccd0d7;padding-top:24px }
      #source-identity-root table { border-collapse:collapse;width:100% }
      #source-identity-root th, #source-identity-root td { padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #ccd0d7 }
      #source-identity-root pre { overflow:auto;background:#ececec;padding:18px;font:13px/1.5 ui-monospace,monospace }
      #source-identity-root summary { cursor:pointer }
      #source-identity-root .diagram-container { overflow:visible }
      #source-identity-root nav { display:none }
      #source-identity-root section { break-inside:avoid }</style><marker id="source-identity-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line class="edge" x1="264" y1="172" x2="480" y2="172"/><rect x="330.4" y="138" width="83.2" height="24" fill="#f5f5f5"/><text x="372" y="152" class="label" text-anchor="middle">1 : 0..N</text><line class="edge" x1="696" y1="172" x2="960" y2="172"/><rect x="773.8" y="138" width="108.4" height="24" fill="#f5f5f5"/><text x="828" y="152" class="label" text-anchor="middle">0..1 : 1..N</text><line class="edge" x1="1068" y1="252" x2="1068" y2="436"/><rect x="1103.0" y="330" width="58.0" height="24" fill="#f5f5f5"/><text x="1132" y="344" class="label" text-anchor="middle">N : 1</text><path class="edge" d="M 588,436 V 352 Q 588,344 596,344 H 1000 Q 1008,344 1008,336 V 252"/><rect x="762.4" y="314" width="83.2" height="24" fill="#f5f5f5"/><text x="804" y="328" class="label" text-anchor="middle">1 : 0..N</text><line class="edge" x1="264" y1="516" x2="480" y2="516"/><rect x="343.0" y="482" width="58.0" height="24" fill="#f5f5f5"/><text x="372" y="496" class="label" text-anchor="middle">N : 0..1</text><g data-node="namespace"><rect class="node-box" x="48" y="92" width="216" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="64" y="116" class="tag" text-anchor="start">ENTITY</text><text x="64" y="144" class="node-name" text-anchor="start">AccountNamespace</text><text x="64" y="172" class="sub" text-anchor="start"># id / provider</text><text x="64" y="194" class="sub" text-anchor="start">random local alias</text></g><g data-node="identity"><rect class="node-box" x="480" y="92" width="216" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="496" y="116" class="tag" text-anchor="start">ENTITY</text><text x="496" y="144" class="node-name" text-anchor="start">SourceIdentity</text><text x="496" y="172" class="sub" text-anchor="start"># strongKey UNIQUE</text><text x="496" y="194" class="sub" text-anchor="start">economicDigest</text></g><g data-node="obs"><rect class="node-box" x="960" y="92" width="256" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="976" y="116" class="tag" text-anchor="start">ENTITY</text><text x="976" y="144" class="node-name" text-anchor="start">SourceObservation</text><text x="976" y="172" class="sub" text-anchor="start">batch + row UNIQUE</text><text x="976" y="194" class="sub" text-anchor="start">fingerprint NON-unique</text></g><g data-node="command"><rect class="node-box" x="48" y="436" width="216" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="64" y="460" class="tag" text-anchor="start">ENTITY</text><text x="64" y="488" class="node-name" text-anchor="start">CommandReceipt</text><text x="64" y="516" class="sub" text-anchor="start"># commandID UNIQUE</text><text x="64" y="538" class="sub" text-anchor="start">requestDigest / result</text></g><g data-node="batch"><rect class="node-box" x="480" y="436" width="216" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="496" y="460" class="tag" text-anchor="start">ENTITY</text><text x="496" y="488" class="node-name" text-anchor="start">BatchReceipt</text><text x="496" y="516" class="sub" text-anchor="start"># fileDigest UNIQUE</text><text x="496" y="538" class="sub" text-anchor="start">committed result</text></g><g data-node="entry"><rect class="node-box" x="960" y="436" width="256" height="160" rx="6" fill="#f8ece7" stroke="#bf4520"/><text x="976" y="460" class="tag" text-anchor="start">ENTITY</text><text x="976" y="488" class="node-name" text-anchor="start">Entry</text><text x="976" y="516" class="sub" text-anchor="start"># UUID</text><text x="976" y="538" class="sub" text-anchor="start">edited values separate</text></g><line class="edge" x1="40" y1="652" x2="1240" y2="652"/><text x="40" y="684" class="tag" text-anchor="start">EXPENSE RECORD · ER / DATA MODEL</text><text x="1240" y="684" class="sub" text-anchor="end">Source contracts define complete behavior</text></svg>
