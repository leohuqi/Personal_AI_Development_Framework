<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="import-state-title import-state-desc" id="import-state-root"><title id="import-state-title">Import transaction and recovery states</title><desc id="import-state-desc">Ordinary state machine chosen because guarded transitions and commit race dominate; not a lifecycle phase map. Idle selection starts parsing. Unsupported and parse failures use the full JSON table. Terminal batches never revert; cleanup failure is committed success. Retry after rollback requires a fresh review. Interrupted save resumes receipt query, not an assumed failure.</desc><defs>
      <style>#import-state-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #import-state-root p, #import-state-root li { line-height:1.6;max-width:95ch }
      #import-state-root a { color:#2e5aa8 }
      #import-state-root nav { display:flex;gap:16px;flex-wrap:wrap }
      #import-state-root .diagram-container { width:100%;overflow-x:auto }
      #import-state-root .node-name { font:600 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #import-state-root .sub { font:14px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #import-state-root .tag { font:12px 'Geist Mono',ui-monospace,monospace;fill:#5a6580;letter-spacing:1px }
      #import-state-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5 }
      #import-state-root .label { font:13px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #import-state-root section { margin:36px 0;border-top:1px solid #ccd0d7;padding-top:24px }
      #import-state-root table { border-collapse:collapse;width:100% }
      #import-state-root th, #import-state-root td { padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #ccd0d7 }
      #import-state-root pre { overflow:auto;background:#ececec;padding:18px;font:13px/1.5 ui-monospace,monospace }
      #import-state-root summary { cursor:pointer }
      #import-state-root .diagram-container { overflow:visible }
      #import-state-root nav { display:none }
      #import-state-root section { break-inside:avoid }</style><marker id="import-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line class="edge" x1="264" y1="196" x2="384" y2="196" marker-end="url(#import-state-arrow)"/><rect x="295.0" y="162" width="58.0" height="24" fill="#f5f5f5"/><text x="324" y="176" class="label" text-anchor="middle">VALID</text><line class="edge" x1="600" y1="196" x2="720" y2="196" marker-end="url(#import-state-arrow)"/><rect x="622.6" y="162" width="74.80000000000001" height="24" fill="#f5f5f5"/><text x="660" y="176" class="label" text-anchor="middle">CONFIRM</text><line class="edge" x1="936" y1="196" x2="1056" y2="196" marker-end="url(#import-state-arrow)"/><rect x="967.0" y="162" width="58.0" height="24" fill="#f5f5f5"/><text x="996" y="176" class="label" text-anchor="middle">SAVED</text><line class="edge" x1="492" y1="260" x2="492" y2="468" marker-end="url(#import-state-arrow)"/><rect x="522.8" y="346" width="66.4" height="24" fill="#f5f5f5"/><text x="556" y="360" class="label" text-anchor="middle">CANCEL</text><line class="edge" x1="828" y1="260" x2="828" y2="468" marker-end="url(#import-state-arrow)"/><rect x="858.4" y="346" width="83.2" height="24" fill="#f5f5f5"/><text x="900" y="360" class="label" text-anchor="middle">ROLLBACK</text><path class="edge" d="M 720,532 H 648 Q 640,532 640,524 V 252 Q 640,244 632,244 H 600" marker-end="url(#import-state-arrow)"/><rect x="505.6" y="402" width="116.80000000000001" height="24" fill="#f5f5f5"/><text x="564" y="416" class="label" text-anchor="middle">REVIEW AGAIN</text><g data-node="parsing"><rect class="node-box" x="48" y="132" width="216" height="128" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="64" y="156" class="tag" text-anchor="start">STATE</text><text x="64" y="184" class="node-name" text-anchor="start">Parsing</text><text x="64" y="212" class="sub" text-anchor="start">selected file</text><text x="64" y="234" class="sub" text-anchor="start">cancel ≤100 rows</text></g><g data-node="review"><rect class="node-box" x="384" y="132" width="216" height="128" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="400" y="156" class="tag" text-anchor="start">STATE</text><text x="400" y="184" class="node-name" text-anchor="start">Review</text><text x="400" y="212" class="sub" text-anchor="start">explicit decisions</text><text x="400" y="234" class="sub" text-anchor="start">epoch + revision</text></g><g data-node="committing"><rect class="node-box" x="720" y="132" width="216" height="128" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="736" y="156" class="tag" text-anchor="start">STATE</text><text x="736" y="184" class="node-name" text-anchor="start">Committing</text><text x="736" y="212" class="sub" text-anchor="start">recheck all</text><text x="736" y="234" class="sub" text-anchor="start">one durable save</text></g><g data-node="committed"><rect class="node-box" x="1056" y="132" width="184" height="128" rx="6" fill="#f8ece7" stroke="#bf4520"/><text x="1072" y="156" class="tag" text-anchor="start">STATE</text><text x="1072" y="184" class="node-name" text-anchor="start">Committed</text><text x="1072" y="212" class="sub" text-anchor="start">receipt replay</text></g><g data-node="cancelled"><rect class="node-box" x="384" y="468" width="216" height="128" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="400" y="492" class="tag" text-anchor="start">STATE</text><text x="400" y="520" class="node-name" text-anchor="start">Cancelled</text><text x="400" y="548" class="sub" text-anchor="start">staging deleted</text></g><g data-node="recoverable"><rect class="node-box" x="720" y="468" width="216" height="128" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="736" y="492" class="tag" text-anchor="start">STATE</text><text x="736" y="520" class="node-name" text-anchor="start">Recoverable</text><text x="736" y="548" class="sub" text-anchor="start">locked/full/stale</text><text x="736" y="570" class="sub" text-anchor="start">no partial writes</text></g><text x="48" y="84" class="node-name" text-anchor="start">Primary lifecycle; full transition/error table in STATE-CONTRACT.json</text><text x="48" y="564" class="sub" text-anchor="start">Unsupported format → stop/reselect.</text><text x="48" y="592" class="sub" text-anchor="start">Parse cancel → cancelled.</text><text x="1016" y="476" class="sub" text-anchor="start">Cancel during save:</text><text x="1016" y="508" class="sub" text-anchor="start">check outcome/receipt;</text><text x="1016" y="540" class="sub" text-anchor="start">commit may already win.</text><line class="edge" x1="40" y1="652" x2="1240" y2="652"/><text x="40" y="684" class="tag" text-anchor="start">EXPENSE RECORD · STATE MACHINE</text><text x="1240" y="684" class="sub" text-anchor="end">Source contracts define complete behavior</text></svg>
