<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ledger-model-title ledger-model-desc" id="ledger-model-root"><title id="ledger-model-title">Ledger, refunds and location provenance</title><desc id="ledger-model-desc">Entity relationships shown at aggregate level. Entry owns append-only location/override evidence; selected pointers must reference the same Entry. RefundLink has two named Entry relationships shown separately: each link has one original and one refund; an original has 0..N links and a refund 0..1. Pair labels read left-to-right. MerchantMapping and singleton StoreMetadata are text-listed rather than disconnected boxes; full attributes, inverses, constraints and indexes remain authoritative in JSON.</desc><defs>
      <style>#ledger-model-root { color: #2d3142; font-family: 'Geist',system-ui,sans-serif; }
      #ledger-model-root p, #ledger-model-root li { line-height:1.6;max-width:95ch }
      #ledger-model-root a { color:#2e5aa8 }
      #ledger-model-root nav { display:flex;gap:16px;flex-wrap:wrap }
      #ledger-model-root .diagram-container { width:100%;overflow-x:auto }
      #ledger-model-root .node-name { font:600 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #ledger-model-root .sub { font:14px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #ledger-model-root .tag { font:12px 'Geist Mono',ui-monospace,monospace;fill:#5a6580;letter-spacing:1px }
      #ledger-model-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5 }
      #ledger-model-root .label { font:13px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #ledger-model-root section { margin:36px 0;border-top:1px solid #ccd0d7;padding-top:24px }
      #ledger-model-root table { border-collapse:collapse;width:100% }
      #ledger-model-root th, #ledger-model-root td { padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #ccd0d7 }
      #ledger-model-root pre { overflow:auto;background:#ececec;padding:18px;font:13px/1.5 ui-monospace,monospace }
      #ledger-model-root summary { cursor:pointer }
      #ledger-model-root .diagram-container { overflow:visible }
      #ledger-model-root nav { display:none }
      #ledger-model-root section { break-inside:avoid }</style><marker id="ledger-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line class="edge" x1="624" y1="296" x2="624" y2="180"/><rect x="659.0" y="226" width="58.0" height="24" fill="#f5f5f5"/><text x="688" y="240" class="label" text-anchor="middle">N : 1</text><line class="edge" x1="296" y1="352" x2="512" y2="352"/><rect x="345.6" y="322" width="116.80000000000001" height="24" fill="#f5f5f5"/><text x="404" y="336" class="label" text-anchor="middle">ORIGINAL N:1</text><line class="edge" x1="296" y1="416" x2="512" y2="416"/><rect x="341.4" y="386" width="125.2" height="24" fill="#f5f5f5"/><text x="404" y="400" class="label" text-anchor="middle">REFUND 0..1:1</text><line class="edge" x1="736" y1="376" x2="960" y2="376"/><rect x="806.4" y="342" width="83.2" height="24" fill="#f5f5f5"/><text x="848" y="356" class="label" text-anchor="middle">1 : 0..N</text><line class="edge" x1="624" y1="456" x2="624" y2="536"/><rect x="642.4" y="490" width="83.2" height="24" fill="#f5f5f5"/><text x="684" y="504" class="label" text-anchor="middle">1 : 0..N</text><g data-node="category"><rect class="node-box" x="512" y="48" width="224" height="132" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="528" y="72" class="tag" text-anchor="start">ENTITY</text><text x="528" y="100" class="node-name" text-anchor="start">Category</text><text x="528" y="128" class="sub" text-anchor="start"># id / retired</text></g><g data-node="entry"><rect class="node-box" x="512" y="296" width="224" height="160" rx="6" fill="#f8ece7" stroke="#bf4520"/><text x="528" y="320" class="tag" text-anchor="start">ENTITY</text><text x="528" y="348" class="node-name" text-anchor="start">Entry</text><text x="528" y="376" class="sub" text-anchor="start">signed minorUnits</text><text x="528" y="398" class="sub" text-anchor="start">currency / timestamp</text></g><g data-node="refund"><rect class="node-box" x="48" y="296" width="248" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="64" y="320" class="tag" text-anchor="start">ENTITY</text><text x="64" y="348" class="node-name" text-anchor="start">RefundLink</text><text x="64" y="376" class="sub" text-anchor="start">refund UNIQUE</text><text x="64" y="398" class="sub" text-anchor="start">original / revision</text></g><g data-node="location"><rect class="node-box" x="960" y="296" width="272" height="160" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="976" y="320" class="tag" text-anchor="start">ENTITY</text><text x="976" y="348" class="node-name" text-anchor="start">LocationEvidence</text><text x="976" y="376" class="sub" text-anchor="start">kind / collectedAt</text><text x="976" y="398" class="sub" text-anchor="start">consent / accuracy</text></g><g data-node="override"><rect class="node-box" x="512" y="536" width="224" height="104" rx="6" fill="#f5f5f5" stroke="#7c8493"/><text x="528" y="560" class="tag" text-anchor="start">ENTITY</text><text x="528" y="588" class="node-name" text-anchor="start">CategoryOverride</text><text x="528" y="616" class="sub" text-anchor="start">entry / category</text></g><text x="48" y="112" class="node-name" text-anchor="start">RefundLink: each refund → one original</text><text x="48" y="144" class="sub" text-anchor="start">Original spend has 0..N links; refund 0..1.</text><text x="48" y="188" class="sub" text-anchor="start">Linked magnitudes ≤ original; same currency.</text><text x="960" y="112" class="node-name" text-anchor="start">Also specified in full JSON</text><text x="960" y="144" class="sub" text-anchor="start">MerchantMapping → Category</text><text x="960" y="176" class="sub" text-anchor="start">StoreMetadata epoch + revision</text><text x="960" y="208" class="sub" text-anchor="start">Selected location / override</text><line class="edge" x1="40" y1="652" x2="1240" y2="652"/><text x="40" y="684" class="tag" text-anchor="start">EXPENSE RECORD · ER / DATA MODEL</text><text x="1240" y="684" class="sub" text-anchor="end">Source contracts define complete behavior</text></svg>
