<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="system-trust-title system-trust-desc" id="system-trust-root"><title id="system-trust-title">Local ledger, explicit boundaries</title><desc id="system-trust-desc">User-selected files enter the iPhone app sandbox; local use cases own ledger writes, suggestions, location requests and backup.</desc><defs>
      <style>#system-trust-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Noto Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #system-trust-root { color: var(--ink); font-family: var(--sans); }
      #system-trust-root .intro { font-size:14px;line-height:1.6;color:var(--muted);max-width:850px;margin:0 0 12px }
      #system-trust-root .diagram-container { width:100%;overflow:auto;min-width:0;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0 }
      #system-trust-root .diagram-container svg { display:block;width:100%;min-width:1280px;height:auto;background:#f5f5f5 }
      #system-trust-root .node-name { font:600 12px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #system-trust-root .sub { font:9px 'Geist Mono',ui-monospace,monospace;fill:#5a6580 }
      #system-trust-root .tag, #system-trust-root .arrow-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;fill:#4f5d75 }
      #system-trust-root .zone-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;fill:#5a6580 }
      #system-trust-root .annotation { font:14px 'Instrument Serif','Noto Serif',serif;font-style:italic;fill:#4f5d75 }
      #system-trust-root .legend { font:10px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #system-trust-root .inspect { cursor:pointer }
      #system-trust-root .inspect:focus { outline:none }
      #system-trust-root .inspect:focus .node-box, #system-trust-root .inspect[data-selected=true] .node-box { stroke:#2e5aa8;stroke-width:3 }
      #system-trust-root button { font:13px var(--sans);color:var(--ink);border:1px solid #bfc0c0;background:#fff;padding:10px 14px;border-radius:6px;cursor:pointer }
      #system-trust-root button:hover { border-color:var(--ink) }
      #system-trust-root button:focus-visible, #system-trust-root a:focus-visible, #system-trust-root summary:focus-visible { outline:3px solid #2e5aa8;outline-offset:3px }
      #system-trust-root .toolbar { display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px }
      #system-trust-root .views, #system-trust-root .zoom { display:flex;gap:6px;flex-wrap:wrap }
      #system-trust-root .views button[aria-pressed=true] { color:#fff;background:var(--ink);border-color:var(--ink) }
      #system-trust-root .zoom output { font:12px var(--mono);align-self:center;min-width:48px;text-align:center }
      #system-trust-root .detail { display:grid;grid-template-columns:240px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid #bfc0c0;min-height:140px }
      #system-trust-root .detail h3 { font-size:16px;margin:0 0 6px }
      #system-trust-root .detail p { font-size:14px;line-height:1.7;margin:0;max-width:950px }
      #system-trust-root .hint { font-size:12px!important;color:var(--muted) }
      #system-trust-root .index { margin:20px 0 }
      #system-trust-root .index summary { cursor:pointer;font-size:13px }
      #system-trust-root .index nav { display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 }
      #system-trust-root .facts { display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:22px }
      #system-trust-root .facts p { font-size:13px;line-height:1.7;margin:0;color:var(--muted) }
      #system-trust-root section[hidden] { display:none }
      #system-trust-root noscript p { font-size:14px }
      #system-trust-root body.nojs .toolbar { display:none }
      #system-trust-root body.nojs .detail { display:none }
      #system-trust-root .detail { grid-template-columns:1fr;gap:8px }
      #system-trust-root .facts { grid-template-columns:1fr;gap:12px }
      #system-trust-root .toolbar, #system-trust-root .index, #system-trust-root .detail { display:none }
      #system-trust-root .diagram-container { overflow:visible }
      #system-trust-root .diagram-container svg { min-width:0!important;width:100%!important }
      #system-trust-root section { display:block!important;break-after:page }</style><marker id="system-trust-system-trust-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="system-trust-system-trust-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker><marker id="system-trust-system-trust-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/><rect x="252" y="96" width="988" height="508" rx="8" fill="#ececec" fill-opacity="0.3" stroke="#5a6580" stroke-dasharray="4 4"/><text x="268" y="120" class="zone-label">IPHONE APP SANDBOX · ONE PROCESS</text><rect x="40" y="96" width="184" height="508" rx="8" fill="#ececec" fill-opacity="0.3" stroke="#5a6580" stroke-dasharray="4 4"/><text x="56" y="120" class="zone-label">USER / UNTRUSTED INPUT</text><path data-from="user" data-to="presentation" d="M 208 200 L 288 200" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#system-trust-system-trust-link)"/><path data-from="presentation" data-to="application" d="M 472 200 L 548 200" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><path data-from="application" data-to="persistence" d="M 732 184 L 1020 184" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><path data-from="file" data-to="import_adapter" d="M 208 440 L 288 440" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#system-trust-system-trust-link)"/><path data-from="application" data-to="import_adapter" d="M 572 240 L 572 308 Q 572 316 564 316 L 388 316 Q 380 316 380 324 L 380 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><path data-from="application" data-to="category_rules" d="M 636 240 L 636 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><path data-from="application" data-to="location_adapter" d="M 700 240 L 700 280 Q 700 288 708 288 L 868 288 Q 876 288 876 296 L 876 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><path data-from="application" data-to="backup_adapter" d="M 732 216 L 980 216 Q 988 216 988 224 L 988 328 Q 988 336 996 336 L 1104 336 Q 1112 336 1112 344 L 1112 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#system-trust-system-trust-arrow)"/><rect x="220.0" y="172" width="56" height="18" fill="#f5f5f5"/><text x="248" y="184" text-anchor="middle" class="arrow-label">EXPLICIT</text><rect x="838.0" y="156" width="76" height="18" fill="#f5f5f5"/><text x="876" y="168" text-anchor="middle" class="arrow-label">ATOMIC WRITE</text><rect x="230.0" y="412" width="36" height="18" fill="#f5f5f5"/><text x="248" y="424" text-anchor="middle" class="arrow-label">COPY</text><rect x="646.5" y="328" width="51" height="18" fill="#f5f5f5"/><text x="672" y="340" text-anchor="middle" class="arrow-label">SUGGEST</text><g class="inspect" data-node="user" data-title="User" data-detail="The user controls manual entry, category overrides, import confirmation, current-location consent and backup destination." aria-label="Inspect User"><rect class="node-box" x="56" y="160" width="152" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="72" y="178" class="tag">ACTOR</text><text x="72" y="200" class="node-name">User</text><text x="72" y="218" class="sub">entry / consent</text></g><g class="inspect" data-node="file" data-title="Selected export" data-detail="Untrusted user-exported bill copy. No provider login, API or automatic history scraping. Strict quotas and supported-profile validation apply." aria-label="Inspect Selected export"><rect class="node-box" x="56" y="400" width="152" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="72" y="418" class="tag">DOCUMENT</text><text x="72" y="440" class="node-name">Selected export</text><text x="72" y="458" class="sub">WeChat / Alipay</text></g><g class="inspect" data-node="presentation" data-title="Presentation" data-detail="Screen state, category dropdown and review/permission feedback. Calls application use cases; never mutates the store directly." aria-label="Inspect Presentation"><rect class="node-box" x="288" y="160" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="304" y="178" class="tag">SCREEN</text><text x="304" y="200" class="node-name">Presentation</text><text x="304" y="218" class="sub">SwiftUI</text></g><g class="inspect" data-node="application" data-title="Application" data-detail="Coordinates versioned commands/results, review, atomic commit, suggestions, explicit location and backup requests. Owns cross-adapter coordination." aria-label="Inspect Application"><rect class="node-box" x="548" y="160" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="564" y="178" class="tag">USE CASE</text><text x="564" y="200" class="node-name">Application</text><text x="564" y="218" class="sub">Swift 6.2</text></g><g class="inspect" data-node="persistence" data-title="Canonical ledger" data-detail="Owns ledger, source evidence, refunds and overrides. One atomic durable import transaction; no direct SQLite queries outside Core Data." aria-label="Inspect Canonical ledger"><rect class="node-box" x="1020" y="160" width="184" height="80" rx="6" fill="#f3e7e2" stroke="#bf4520"/><text x="1036" y="178" class="tag">STORE</text><text x="1036" y="200" class="node-name">Canonical ledger</text><text x="1036" y="218" class="sub">Core Data / SQLite</text></g><g class="inspect" data-node="import_adapter" data-title="Import adapter" data-detail="Supported profile registry, bounded streaming validation and normalization. Selected copies are protected staging, transient and read-only to this adapter." aria-label="Inspect Import adapter"><rect class="node-box" x="288" y="400" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="304" y="418" class="tag">VALIDATION</text><text x="304" y="440" class="node-name">Import adapter</text><text x="304" y="458" class="sub">Foundation</text></g><g class="inspect" data-node="category_rules" data-title="Category rules" data-detail="Reproducible local suggestions with version and reason. Explicit user choice always wins; reimport never silently replaces overrides." aria-label="Inspect Category rules"><rect class="node-box" x="548" y="400" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="564" y="418" class="tag">SUGGESTION</text><text x="564" y="440" class="node-name">Category rules</text><text x="564" y="458" class="sub">local / versioned</text></g><g class="inspect" data-node="location_adapter" data-title="Location access" data-detail="Collects a current fix only on explicit request, with collectedAt, accuracy and purpose. Current GPS never asserts a historical purchase location." aria-label="Inspect Location access"><rect class="node-box" x="784" y="400" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="800" y="418" class="tag">CONSENT</text><text x="800" y="440" class="node-name">Location access</text><text x="800" y="458" class="sub">foreground only</text></g><g class="inspect" data-node="backup_adapter" data-title="Backup archive" data-detail="Explicit encrypted portable backup and staged restore. Invalid password, corruption or unsupported schema leaves the current ledger untouched." aria-label="Inspect Backup archive"><rect class="node-box" x="1020" y="400" width="184" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="1036" y="418" class="tag">RECOVERY</text><text x="1036" y="440" class="node-name">Backup archive</text><text x="1036" y="458" class="sub">CryptoKit / KDF</text></g><text x="288" y="548" class="annotation">No provider credentials, network API, backend or remote inference.</text><text x="288" y="580" class="annotation">Only user-confirmed data becomes canonical; source evidence remains auditable.</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="690" class="legend">Architecture · Arrows show explicit flow. Node responsibilities are listed in the source HTML.</text></svg>
