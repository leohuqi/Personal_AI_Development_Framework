<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="package-core-title package-core-desc" id="package-core-root"><title id="package-core-title">Packages point inward</title><desc id="package-core-desc">The composition root wires presentation and adapters; presentation calls application ports and the domain stays independent of UI, storage and permissions.</desc><defs>
      <style>#package-core-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Noto Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #package-core-root { color: var(--ink); font-family: var(--sans); }
      #package-core-root .intro { font-size:14px;line-height:1.6;color:var(--muted);max-width:850px;margin:0 0 12px }
      #package-core-root .diagram-container { width:100%;overflow:auto;min-width:0;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0 }
      #package-core-root .diagram-container svg { display:block;width:100%;min-width:1280px;height:auto;background:#f5f5f5 }
      #package-core-root .node-name { font:600 12px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #package-core-root .sub { font:9px 'Geist Mono',ui-monospace,monospace;fill:#5a6580 }
      #package-core-root .tag, #package-core-root .arrow-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;fill:#4f5d75 }
      #package-core-root .zone-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;fill:#5a6580 }
      #package-core-root .annotation { font:14px 'Instrument Serif','Noto Serif',serif;font-style:italic;fill:#4f5d75 }
      #package-core-root .legend { font:10px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #package-core-root .inspect { cursor:pointer }
      #package-core-root .inspect:focus { outline:none }
      #package-core-root .inspect:focus .node-box, #package-core-root .inspect[data-selected=true] .node-box { stroke:#2e5aa8;stroke-width:3 }
      #package-core-root button { font:13px var(--sans);color:var(--ink);border:1px solid #bfc0c0;background:#fff;padding:10px 14px;border-radius:6px;cursor:pointer }
      #package-core-root button:hover { border-color:var(--ink) }
      #package-core-root button:focus-visible, #package-core-root a:focus-visible, #package-core-root summary:focus-visible { outline:3px solid #2e5aa8;outline-offset:3px }
      #package-core-root .toolbar { display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px }
      #package-core-root .views, #package-core-root .zoom { display:flex;gap:6px;flex-wrap:wrap }
      #package-core-root .views button[aria-pressed=true] { color:#fff;background:var(--ink);border-color:var(--ink) }
      #package-core-root .zoom output { font:12px var(--mono);align-self:center;min-width:48px;text-align:center }
      #package-core-root .detail { display:grid;grid-template-columns:240px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid #bfc0c0;min-height:140px }
      #package-core-root .detail h3 { font-size:16px;margin:0 0 6px }
      #package-core-root .detail p { font-size:14px;line-height:1.7;margin:0;max-width:950px }
      #package-core-root .hint { font-size:12px!important;color:var(--muted) }
      #package-core-root .index { margin:20px 0 }
      #package-core-root .index summary { cursor:pointer;font-size:13px }
      #package-core-root .index nav { display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 }
      #package-core-root .facts { display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:22px }
      #package-core-root .facts p { font-size:13px;line-height:1.7;margin:0;color:var(--muted) }
      #package-core-root section[hidden] { display:none }
      #package-core-root noscript p { font-size:14px }
      #package-core-root body.nojs .toolbar { display:none }
      #package-core-root body.nojs .detail { display:none }
      #package-core-root .detail { grid-template-columns:1fr;gap:8px }
      #package-core-root .facts { grid-template-columns:1fr;gap:12px }
      #package-core-root .toolbar, #package-core-root .index, #package-core-root .detail { display:none }
      #package-core-root .diagram-container { overflow:visible }
      #package-core-root .diagram-container svg { min-width:0!important;width:100%!important }
      #package-core-root section { display:block!important;break-after:page }</style><marker id="package-core-package-core-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="package-core-package-core-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker><marker id="package-core-package-core-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/><path data-from="App" data-to="LedgerPresentation" d="M 568 160 L 568 196 Q 568 204 560 204 L 388 204 Q 380 204 380 212 L 380 248" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="App" data-to="adapters" d="M 712 160 L 712 196 Q 712 204 720 204 L 996 204 Q 1004 204 1004 212 L 1004 248" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="LedgerPresentation" data-to="DesignSystem" d="M 312 328 L 312 376 Q 312 384 304 384 L 204 384 Q 196 384 196 392 L 196 440" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="LedgerPresentation" data-to="LedgerApplication" d="M 448 328 L 448 376 Q 448 384 456 384 L 636 384 Q 644 384 644 392 L 644 440" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="adapters" data-to="LedgerApplication" d="M 888 376 L 888 472 Q 888 480 880 480 L 760 480" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="LedgerApplication" data-to="LedgerDomain" d="M 644 520 L 644 568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><path data-from="adapters" data-to="LedgerDomain" d="M 1120 376 L 1120 596 Q 1120 604 1112 604 L 760 604" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-core-package-core-arrow)"/><g class="inspect" data-node="App" data-title="App" data-detail="The sole composition root wires LedgerPresentation and the five concrete adapters: LedgerPersistence, BillImport, CategoryRules, LocationAccess and BackupArchive." aria-label="Inspect App"><rect class="node-box" x="528" y="80" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="544" y="98" class="tag">ROOT</text><text x="544" y="120" class="node-name">App</text><text x="544" y="138" class="sub">composition / lifecycle</text><text x="740" y="98" text-anchor="end" class="tag">0 in</text></g><g class="inspect" data-node="LedgerPresentation" data-title="LedgerPresentation" data-detail="Depends on LedgerApplication and DesignSystem. Cannot depend directly on persistence or other adapters." aria-label="Inspect LedgerPresentation"><rect class="node-box" x="264" y="248" width="232" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="280" y="266" class="tag">PACKAGE</text><text x="280" y="288" class="node-name">LedgerPresentation</text><text x="280" y="306" class="sub">screens / view state</text><text x="484" y="266" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="adapters" data-title="Adapters ×5" data-detail="Aggregate of exactly five packages. App depends on each; each depends on LedgerApplication ports and LedgerDomain. No adapter-to-adapter or adapter-to-Presentation dependencies." aria-label="Inspect Adapters ×5"><rect class="node-box" x="824" y="248" width="360" height="128" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="840" y="266" class="tag">EXPANDED IN ADAPTER VIEW</text><text x="840" y="288" class="node-name">Adapters ×5</text><text x="840" y="306" class="sub">LedgerPersistence · BillImport</text><text x="840" y="322" class="sub">CategoryRules · LocationAccess</text><text x="840" y="338" class="sub">BackupArchive</text><text x="1172" y="266" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="DesignSystem" data-title="DesignSystem" data-detail="Presentation dependency only. Visual tokens/components require the separately approved UI Profile; this architecture viewer establishes no app UI design." aria-label="Inspect DesignSystem"><rect class="node-box" x="80" y="440" width="232" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="96" y="458" class="tag">PACKAGE</text><text x="96" y="480" class="node-name">DesignSystem</text><text x="96" y="498" class="sub">tokens / components</text><text x="300" y="458" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="LedgerApplication" data-title="LedgerApplication" data-detail="Depends only on LedgerDomain; coordinates adapters through ports. Actual graph fan-in is 6 (Presentation plus five adapters)." aria-label="Inspect LedgerApplication"><rect class="node-box" x="528" y="440" width="232" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="544" y="458" class="tag">PACKAGE</text><text x="544" y="480" class="node-name">LedgerApplication</text><text x="544" y="498" class="sub">use cases / ports</text><text x="748" y="458" text-anchor="end" class="tag">6 in</text></g><g class="inspect" data-node="LedgerDomain" data-title="LedgerDomain" data-detail="Money, ledger and provenance invariants; no UI, storage or permission framework. Actual graph fan-in is 6 (Application plus five adapters)." aria-label="Inspect LedgerDomain"><rect class="node-box" x="528" y="568" width="232" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="544" y="586" class="tag">PACKAGE</text><text x="544" y="608" class="node-name">LedgerDomain</text><text x="544" y="626" class="sub">Foundation-only policies</text><text x="748" y="586" text-anchor="end" class="tag">6 in</text></g><text x="80" y="600" class="annotation">Five adapter dependencies are expanded in the next view.</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="690" class="legend">Dependency graph · Arrows show dependency direction. Node responsibilities are listed in the source HTML.</text></svg>
