<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="import-workflow-title import-workflow-desc" id="import-workflow-root"><title id="import-workflow-title">Review first. Commit atomically.</title><desc id="import-workflow-desc">Selected exports are validated and reviewed before explicit atomic commit; cancellation and failures preserve the canonical ledger.</desc><defs>
      <style>#import-workflow-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Noto Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #import-workflow-root { color: var(--ink); font-family: var(--sans); }
      #import-workflow-root .intro { font-size:14px;line-height:1.6;color:var(--muted);max-width:850px;margin:0 0 12px }
      #import-workflow-root .diagram-container { width:100%;overflow:auto;min-width:0;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0 }
      #import-workflow-root .diagram-container svg { display:block;width:100%;min-width:1280px;height:auto;background:#f5f5f5 }
      #import-workflow-root .node-name { font:600 12px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #import-workflow-root .sub { font:9px 'Geist Mono',ui-monospace,monospace;fill:#5a6580 }
      #import-workflow-root .tag, #import-workflow-root .arrow-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;fill:#4f5d75 }
      #import-workflow-root .zone-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;fill:#5a6580 }
      #import-workflow-root .annotation { font:14px 'Instrument Serif','Noto Serif',serif;font-style:italic;fill:#4f5d75 }
      #import-workflow-root .legend { font:10px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #import-workflow-root .inspect { cursor:pointer }
      #import-workflow-root .inspect:focus { outline:none }
      #import-workflow-root .inspect:focus .node-box, #import-workflow-root .inspect[data-selected=true] .node-box { stroke:#2e5aa8;stroke-width:3 }
      #import-workflow-root button { font:13px var(--sans);color:var(--ink);border:1px solid #bfc0c0;background:#fff;padding:10px 14px;border-radius:6px;cursor:pointer }
      #import-workflow-root button:hover { border-color:var(--ink) }
      #import-workflow-root button:focus-visible, #import-workflow-root a:focus-visible, #import-workflow-root summary:focus-visible { outline:3px solid #2e5aa8;outline-offset:3px }
      #import-workflow-root .toolbar { display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px }
      #import-workflow-root .views, #import-workflow-root .zoom { display:flex;gap:6px;flex-wrap:wrap }
      #import-workflow-root .views button[aria-pressed=true] { color:#fff;background:var(--ink);border-color:var(--ink) }
      #import-workflow-root .zoom output { font:12px var(--mono);align-self:center;min-width:48px;text-align:center }
      #import-workflow-root .detail { display:grid;grid-template-columns:240px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid #bfc0c0;min-height:140px }
      #import-workflow-root .detail h3 { font-size:16px;margin:0 0 6px }
      #import-workflow-root .detail p { font-size:14px;line-height:1.7;margin:0;max-width:950px }
      #import-workflow-root .hint { font-size:12px!important;color:var(--muted) }
      #import-workflow-root .index { margin:20px 0 }
      #import-workflow-root .index summary { cursor:pointer;font-size:13px }
      #import-workflow-root .index nav { display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 }
      #import-workflow-root .facts { display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:22px }
      #import-workflow-root .facts p { font-size:13px;line-height:1.7;margin:0;color:var(--muted) }
      #import-workflow-root section[hidden] { display:none }
      #import-workflow-root noscript p { font-size:14px }
      #import-workflow-root body.nojs .toolbar { display:none }
      #import-workflow-root body.nojs .detail { display:none }
      #import-workflow-root .detail { grid-template-columns:1fr;gap:8px }
      #import-workflow-root .facts { grid-template-columns:1fr;gap:12px }
      #import-workflow-root .toolbar, #import-workflow-root .index, #import-workflow-root .detail { display:none }
      #import-workflow-root .diagram-container { overflow:visible }
      #import-workflow-root .diagram-container svg { min-width:0!important;width:100%!important }
      #import-workflow-root section { display:block!important;break-after:page }</style><marker id="import-workflow-import-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="import-workflow-import-workflow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker><marker id="import-workflow-import-workflow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/><path data-from="select" data-to="validate" d="M 648 120 L 648 152" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="validate" data-to="review" d="M 648 224 L 648 256" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="validate" data-to="unsupported" d="M 536 188 L 408 188" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="review" data-to="confirm" d="M 648 328 L 648 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="confirm" data-to="commit" d="M 648 440 L 648 464" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="confirm" data-to="cancel" d="M 748 400 L 920 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="commit" data-to="success" d="M 648 536 L 648 568" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><path data-from="commit" data-to="rollback" d="M 760 500 L 920 500" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#import-workflow-import-workflow-arrow)"/><rect x="436.5" y="160" width="71" height="18" fill="#f5f5f5"/><text x="472" y="172" text-anchor="middle" class="arrow-label">UNSUPPORTED</text><rect x="672.5" y="444" width="31" height="18" fill="#f5f5f5"/><text x="688" y="456" text-anchor="middle" class="arrow-label">YES</text><rect x="800.5" y="372" width="71" height="18" fill="#f5f5f5"/><text x="836" y="384" text-anchor="middle" class="arrow-label">NO / CANCEL</text><rect x="814.5" y="472" width="51" height="18" fill="#f5f5f5"/><text x="840" y="484" text-anchor="middle" class="arrow-label">FAILURE</text><g class="inspect" data-node="select" data-title="Select exported file" data-detail="User picks a previously exported WeChat/Alipay document. Copy to protected staging; maximum 10 MiB, 10,000 rows and 256 KiB per row. No provider login." aria-label="Inspect Select exported file"><rect class="node-box" x="536" y="48" width="224" height="72" rx="24" fill="#f5f5f5" stroke="#2d3142"/><text x="552" y="66" class="tag">INPUT</text><text x="552" y="88" class="node-name">Select exported file</text><text x="552" y="106" class="sub">bounded protected copy</text></g><g class="inspect" data-node="validate" data-title="Detect and validate" data-detail="Detect supported profile, normalize and validate with bounded streaming parser. Never guess an unknown financial format. Retain provider/profile/version, source-file hash and source row identity." aria-label="Inspect Detect and validate"><rect class="node-box" x="536" y="152" width="224" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="552" y="170" class="tag">STEP</text><text x="552" y="192" class="node-name">Detect and validate</text><text x="552" y="210" class="sub">explicit profile / encoding</text></g><g class="inspect" data-node="review" data-title="Preview and review" data-detail="Local category rules provide versioned reasoned suggestions, user overrides win. Ambiguous duplicates require review. Retain unresolved refunds and exclude them from settled net totals until linked; preserve source evidence. Import never automatically requests GPS." aria-label="Inspect Preview and review"><rect class="node-box" x="536" y="256" width="224" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="552" y="274" class="tag">STEP</text><text x="552" y="296" class="node-name">Preview and review</text><text x="552" y="314" class="sub">suggestions / duplicates</text></g><g class="inspect" data-node="confirm" data-title="Confirm import?" data-detail="Only an explicit user confirmation authorizes the ledger transaction. Cancellation discards staging and preserves ledger." aria-label="Inspect Confirm import?"><path class="node-box" d="M 648.0 360 L 748 400.0 L 648.0 440 L 548 400.0 Z" fill="#f5f5f5" stroke="#2d3142"/><text x="648.0" y="404.0" text-anchor="middle" class="node-name">Confirm import?</text></g><g class="inspect" data-node="commit" data-title="Commit one batch" data-detail="Persistence commits all entries, source/refund/override records atomically. Strong provider/account/transaction identity or reviewed fingerprint handles duplicates across overlapping exports. Same file hash prevents repeated batch commit." aria-label="Inspect Commit one batch"><rect class="node-box" x="536" y="464" width="224" height="72" rx="6" fill="#f3e7e2" stroke="#bf4520"/><text x="552" y="482" class="tag">STEP</text><text x="552" y="504" class="node-name">Commit one batch</text><text x="552" y="522" class="sub">atomic durable transaction</text></g><g class="inspect" data-node="success" data-title="Saved + cleaned" data-detail="Canonical ledger is durable; delete staging after completion. Crash after durable commit: reopening the batch ID returns the committed result. No partial commit." aria-label="Inspect Saved + cleaned"><rect class="node-box" x="536" y="568" width="224" height="72" rx="24" fill="#f5f5f5" stroke="#2d3142"/><text x="552" y="586" class="tag">END</text><text x="552" y="608" class="node-name">Saved + cleaned</text><text x="552" y="626" class="sub">staging deleted</text></g><g class="inspect" data-node="unsupported" data-title="Stop: unsupported input" data-detail="Unknown profile, header, encoding or quota violation stops import. Actionable report uses row numbers/codes by default. Ledger unchanged; protected staging cleaned on review completion/cancellation." aria-label="Inspect Stop: unsupported input"><rect class="node-box" x="112" y="152" width="296" height="72" rx="24" fill="#f5f5f5" stroke="#2d3142"/><text x="128" y="170" class="tag">END</text><text x="128" y="192" class="node-name">Stop: unsupported input</text><text x="128" y="210" class="sub">safe format / validation report</text></g><g class="inspect" data-node="cancel" data-title="Cancel + discard staging" data-detail="Cancel before commit removes staging only. Raw source documents are transient and deleted after completion or cancellation; never used as portable backup." aria-label="Inspect Cancel + discard staging"><rect class="node-box" x="920" y="360" width="288" height="80" rx="24" fill="#f5f5f5" stroke="#2d3142"/><text x="936" y="378" class="tag">END</text><text x="936" y="400" class="node-name">Cancel + discard staging</text><text x="936" y="418" class="sub">ledger unchanged</text></g><g class="inspect" data-node="rollback" data-title="Rollback / safe retry" data-detail="Crash before durable commit, locked store, disk full or transaction failure cannot leave partial entries. Retry must remain idempotent. Persist safe error codes/counts only, no amounts, merchants, coordinates or raw provider IDs." aria-label="Inspect Rollback / safe retry"><rect class="node-box" x="920" y="464" width="288" height="112" rx="24" fill="#f5f5f5" stroke="#2d3142"/><text x="936" y="482" class="tag">END</text><text x="936" y="504" class="node-name">Rollback / safe retry</text><text x="936" y="522" class="sub">ledger unchanged</text><text x="936" y="538" class="sub">stable code / recoverability</text></g><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="690" class="legend">Flowchart · Arrows show explicit flow. Node responsibilities are listed in the source HTML.</text></svg>
