<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="package-adapters-title package-adapters-desc" id="package-adapters-root"><title id="package-adapters-title">Five adapters, two shared contracts</title><desc id="package-adapters-desc">Every concrete adapter depends on application ports and domain policies, with no dependencies between adapters.</desc><defs>
      <style>#package-adapters-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif','Noto Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #package-adapters-root { color: var(--ink); font-family: var(--sans); }
      #package-adapters-root .intro { font-size:14px;line-height:1.6;color:var(--muted);max-width:850px;margin:0 0 12px }
      #package-adapters-root .diagram-container { width:100%;overflow:auto;min-width:0;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0 }
      #package-adapters-root .diagram-container svg { display:block;width:100%;min-width:1280px;height:auto;background:#f5f5f5 }
      #package-adapters-root .node-name { font:600 12px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #package-adapters-root .sub { font:9px 'Geist Mono',ui-monospace,monospace;fill:#5a6580 }
      #package-adapters-root .tag, #package-adapters-root .arrow-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;fill:#4f5d75 }
      #package-adapters-root .zone-label { font:8px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;fill:#5a6580 }
      #package-adapters-root .annotation { font:14px 'Instrument Serif','Noto Serif',serif;font-style:italic;fill:#4f5d75 }
      #package-adapters-root .legend { font:10px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #package-adapters-root .inspect { cursor:pointer }
      #package-adapters-root .inspect:focus { outline:none }
      #package-adapters-root .inspect:focus .node-box, #package-adapters-root .inspect[data-selected=true] .node-box { stroke:#2e5aa8;stroke-width:3 }
      #package-adapters-root button { font:13px var(--sans);color:var(--ink);border:1px solid #bfc0c0;background:#fff;padding:10px 14px;border-radius:6px;cursor:pointer }
      #package-adapters-root button:hover { border-color:var(--ink) }
      #package-adapters-root button:focus-visible, #package-adapters-root a:focus-visible, #package-adapters-root summary:focus-visible { outline:3px solid #2e5aa8;outline-offset:3px }
      #package-adapters-root .toolbar { display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px }
      #package-adapters-root .views, #package-adapters-root .zoom { display:flex;gap:6px;flex-wrap:wrap }
      #package-adapters-root .views button[aria-pressed=true] { color:#fff;background:var(--ink);border-color:var(--ink) }
      #package-adapters-root .zoom output { font:12px var(--mono);align-self:center;min-width:48px;text-align:center }
      #package-adapters-root .detail { display:grid;grid-template-columns:240px 1fr;gap:28px;padding:24px 0;border-bottom:1px solid #bfc0c0;min-height:140px }
      #package-adapters-root .detail h3 { font-size:16px;margin:0 0 6px }
      #package-adapters-root .detail p { font-size:14px;line-height:1.7;margin:0;max-width:950px }
      #package-adapters-root .hint { font-size:12px!important;color:var(--muted) }
      #package-adapters-root .index { margin:20px 0 }
      #package-adapters-root .index summary { cursor:pointer;font-size:13px }
      #package-adapters-root .index nav { display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 }
      #package-adapters-root .facts { display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:22px }
      #package-adapters-root .facts p { font-size:13px;line-height:1.7;margin:0;color:var(--muted) }
      #package-adapters-root section[hidden] { display:none }
      #package-adapters-root noscript p { font-size:14px }
      #package-adapters-root body.nojs .toolbar { display:none }
      #package-adapters-root body.nojs .detail { display:none }
      #package-adapters-root .detail { grid-template-columns:1fr;gap:8px }
      #package-adapters-root .facts { grid-template-columns:1fr;gap:12px }
      #package-adapters-root .toolbar, #package-adapters-root .index, #package-adapters-root .detail { display:none }
      #package-adapters-root .diagram-container { overflow:visible }
      #package-adapters-root .diagram-container svg { min-width:0!important;width:100%!important }
      #package-adapters-root section { display:block!important;break-after:page }</style><marker id="package-adapters-package-adapters-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="package-adapters-package-adapters-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker><marker id="package-adapters-package-adapters-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/><path data-from="LedgerPersistence" data-to="LedgerApplication" d="M 128 208 L 128 236 Q 128 244 136 244 L 264 244 Q 272 244 272 252 L 272 424" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><path data-from="LedgerPersistence" data-to="LedgerDomain" d="M 216 208 L 216 320 Q 216 328 224 328 L 800 328 Q 808 328 808 336 L 808 552" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><circle cx="216" cy="244" r="6" fill="#f5f5f5"/><path d="M 216 238 Q 228 244 216 250" fill="none" stroke="#4f5d75" stroke-width="1.5"/><circle cx="272" cy="328" r="6" fill="#f5f5f5"/><path d="M 266 328 Q 272 316 278 328" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path data-from="BillImport" data-to="LedgerApplication" d="M 360 208 L 360 252 Q 360 260 352 260 L 328 260 Q 320 260 320 268 L 320 424" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><circle cx="320" cy="328" r="6" fill="#f5f5f5"/><path d="M 320 322 Q 332 328 320 334" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path data-from="BillImport" data-to="LedgerDomain" d="M 448 208 L 448 336 Q 448 344 456 344 L 856 344 Q 864 344 864 352 L 864 552" fill="none" stroke="#4f5d75" stroke-width="1.5" marke