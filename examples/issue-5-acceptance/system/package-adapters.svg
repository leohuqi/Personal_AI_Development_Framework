th="1.5"/><circle cx="680" cy="292" r="6" fill="#f5f5f5"/><path d="M 674 292 Q 680 280 686 292" fill="none" stroke="#4f5d75" stroke-width="1.5"/><circle cx="416" cy="328" r="6" fill="#f5f5f5"/><path d="M 416 322 Q 428 328 416 334" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path data-from="LocationAccess" data-to="LedgerDomain" d="M 912 208 L 912 368 Q 912 376 920 376 L 968 376 Q 976 376 976 384 L 976 552" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><path data-from="BackupArchive" data-to="LedgerApplication" d="M 1056 208 L 1056 300 Q 1056 308 1048 308 L 472 308 Q 464 308 464 316 L 464 424" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><circle cx="680" cy="308" r="6" fill="#f5f5f5"/><path d="M 674 308 Q 680 296 686 308" fill="none" stroke="#4f5d75" stroke-width="1.5"/><circle cx="912" cy="308" r="6" fill="#f5f5f5"/><path d="M 906 308 Q 912 296 918 308" fill="none" stroke="#4f5d75" stroke-width="1.5"/><circle cx="464" cy="328" r="6" fill="#f5f5f5"/><path d="M 464 322 Q 476 328 464 334" fill="none" stroke="#4f5d75" stroke-width="1.5"/><circle cx="464" cy="344" r="6" fill="#f5f5f5"/><path d="M 464 338 Q 476 344 464 350" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path data-from="BackupArchive" data-to="LedgerDomain" d="M 1144 208 L 1144 384 Q 1144 392 1136 392 L 1040 392 Q 1032 392 1032 400 L 1032 552" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#package-adapters-package-adapters-arrow)"/><g class="inspect" data-node="LedgerPersistence" data-title="LedgerPersistence" data-detail="Core Data adapter, model and migrations. Depends on LedgerApplication and LedgerDomain only; App creates and wires it." aria-label="Inspect LedgerPersistence"><rect class="node-box" x="80" y="128" width="192" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="96" y="146" class="tag">ADAPTER</text><text x="96" y="168" class="node-name">LedgerPersistence</text><text x="96" y="186" class="sub">application + domain</text><text x="260" y="146" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="BillImport" data-title="BillImport" data-detail="Provider export adapters and supported profile registry. Depends on LedgerApplication and LedgerDomain only; App creates and wires it." aria-label="Inspect BillImport"><rect class="node-box" x="312" y="128" width="192" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="328" y="146" class="tag">ADAPTER</text><text x="328" y="168" class="node-name">BillImport</text><text x="328" y="186" class="sub">application + domain</text><text x="492" y="146" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="CategoryRules" data-title="CategoryRules" data-detail="Deterministic local rules and user mappings. Depends on LedgerApplication and LedgerDomain only; App creates and wires it." aria-label="Inspect CategoryRules"><rect class="node-box" x="544" y="128" width="192" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="560" y="146" class="tag">ADAPTER</text><text x="560" y="168" class="node-name">CategoryRules</text><text x="560" y="186" class="sub">application + domain</text><text x="724" y="146" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="LocationAccess" data-title="LocationAccess" data-detail="Core Location foreground adapter. Depends on LedgerApplication and LedgerDomain only; App creates and wires it." aria-label="Inspect LocationAccess"><rect class="node-box" x="776" y="128" width="192" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="792" y="146" class="tag">ADAPTER</text><text x="792" y="168" class="node-name">LocationAccess</text><text x="792" y="186" class="sub">application + domain</text><text x="956" y="146" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="BackupArchive" data-title="BackupArchive" data-detail="Portable schema, authenticated encryption and file adapter. Depends on LedgerApplication and LedgerDomain only; App creates and wires it." aria-label="Inspect BackupArchive"><rect class="node-box" x="1008" y="128" width="192" height="80" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="1024" y="146" class="tag">ADAPTER</text><text x="1024" y="168" class="node-name">BackupArchive</text><text x="1024" y="186" class="sub">application + domain</text><text x="1188" y="146" text-anchor="end" class="tag">1 in</text></g><g class="inspect" data-node="LedgerApplication" data-title="LedgerApplication" data-detail="All five concrete adapters depend on application-defined ports. Application coordinates adapters without referencing concrete implementations. Badge is full graph fan-in, including Presentation." aria-label="Inspect LedgerApplication"><rect class="node-box" x="224" y="424" width="304" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="240" y="442" class="tag">CONTRACT</text><text x="240" y="464" class="node-name">LedgerApplication</text><text x="240" y="482" class="sub">use cases and ports</text><text x="516" y="442" text-anchor="end" class="tag">6 in</text></g><g class="inspect" data-node="LedgerDomain" data-title="LedgerDomain" data-detail="All five adapters and Application depend on domain policies. No dependency from Domain to UI, storage or permission frameworks." aria-label="Inspect LedgerDomain"><rect class="node-box" x="776" y="552" width="304" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142"/><text x="792" y="570" class="tag">POLICY</text><text x="792" y="592" class="node-name">LedgerDomain</text><text x="792" y="610" class="sub">pure Swift / Foundation</text><text x="1068" y="570" text-anchor="end" class="tag">6 in</text></g><text x="80" y="596" class="annotation">App wires all five adapters; no lateral adapter imports.</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="690" class="legend">Dependency graph · Arrows show dependency direction. Node responsibilities are listed in the source HTML.</text></svg>
