<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="standard-container-title standard-container-desc" id="standard-container-root"><title id="standard-container-title">Standard · 三个运行边界</title><desc id="standard-container-desc">说明Web/API/数据存储责任</desc><defs>
      <style>#standard-container-root { color: #2d3142; font-family: 'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif; }
      #standard-container-root .diagram-container { width:100%;overflow-x:auto }
      #standard-container-root .name { font-family:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;font-size:20px;font-weight:600;fill:#2d3142 }
      #standard-container-root .sub, #standard-container-root .tag, #standard-container-root .edge { font-family:'Geist Mono','PingFang SC',Menlo,ui-monospace,monospace;font-size:14px;fill:#4f5d75 }
      #standard-container-root .guard { font-family:'Geist','PingFang SC',system-ui,sans-serif;font-size:14px;fill:#4f5d75 }
      #standard-container-root .caption { font-family:'Geist','PingFang SC',system-ui,sans-serif;font-size:16px;fill:#4f5d75 }
      #standard-container-root .diagram-container { overflow-x:visible }</style><marker id="standard-container-standard-container-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="standard-container-standard-container-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="standard-container-standard-container-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><g data-edge-id="S1" data-from="S-WEB" data-to="S-API"><path d="M 360,348 H 480" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#standard-container-standard-container-arrow)"/></g><g data-label="HTTPS"><rect x="392.0" y="298" width="56" height="24" rx="2" fill="#f5f5f5"/><text x="420" y="316" class="edge" text-anchor="middle" >HTTPS</text></g><g data-edge-id="S2" data-from="S-API" data-to="S-DB"><path d="M 760,348 H 880" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#standard-container-standard-container-arrow)"/></g><g data-label="READ / WRITE"><rect x="764.0" y="298" width="112" height="24" rx="2" fill="#f5f5f5"/><text x="820" y="316" class="edge" text-anchor="middle" >READ / WRITE</text></g><g data-node-id="S-WEB" data-kind="CONTAINER"><rect data-role="bounds" x="80" y="276" width="280" height="144" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/><text x="96" y="300" class="tag" text-anchor="start" >CONTAINER</text><text x="220.0" y="336" class="name" text-anchor="middle" >Web应用</text><text x="220.0" y="364" class="sub" text-anchor="middle" >Browser</text></g><g data-node-id="S-API" data-kind="CONTAINER"><rect data-role="bounds" x="480" y="276" width="280" height="144" rx="6" fill="#fae9e4" stroke="#bf4520" stroke-width="1.5"/><text x="496" y="300" class="tag" text-anchor="start" >CONTAINER</text><text x="620.0" y="336" class="name" text-anchor="middle" >目录API</text><text x="620.0" y="364" class="sub" text-anchor="middle" >Catalog / Policy</text></g><g data-node-id="S-DB" data-kind="STORE"><rect data-role="bounds" x="880" y="276" width="280" height="144" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/><text x="896" y="300" class="tag" text-anchor="start" >STORE</text><text x="1020.0" y="336" class="name" text-anchor="middle" >记录存储</text><text x="1020.0" y="364" class="sub" text-anchor="middle" >Record / Revision</text></g><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="688" class="caption" text-anchor="start" >PROPOSED · 合成文档练习 · ARCHITECTURE</text></svg>
