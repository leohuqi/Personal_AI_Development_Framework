name: CACF contract validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - '.agents/**'
      - 'contracts/**'
      - 'governance/**'
      - 'workflow/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/cacf/**'
      - '.github/workflows/cacf-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cacf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CACF structural references and schema markers
        run: node scripts/validate-cacf.mjs
      - name: JavaScript syntax
        run: node --check tests/cacf/run-validation.mjs
      - name: Cross-process protocol simulation
        run: node tests/cacf/run-validation.mjs
