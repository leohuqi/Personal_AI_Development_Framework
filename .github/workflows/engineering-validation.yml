name: PADF Engineering validation
on:
  pull_request:
    paths: ['lib/**', 'scripts/engineering*', 'tests/engineering/**', 'examples/engineering/**', 'contracts/**', 'standards/engineering/**', '.github/workflows/engineering-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install isolated pilot and schema-test dependencies
        run: |
          python -m pip install -r examples/engineering/python/requirements.txt jsonschema==4.25.0
      - name: Fetch pinned Java test tools and verify actual bytes
        run: |
          mkdir -p dependencies
          curl --fail --location --retry 2 -o dependencies/junit-platform-console-standalone-1.11.4.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          curl --fail --location --retry 2 -o dependencies/org.jacoco.agent-0.8.12-runtime.jar https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar
          curl --fail --location --retry 2 -o dependencies/org.jacoco.cli-0.8.12-nodeps.jar https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar
          sha256sum --check examples/engineering/java/dependencies.sha256
      - name: Offline report, RTM and hostile-input regressions
        run: |
          node tests/engineering/run-tests.mjs
          node tests/engineering/run-adapter-tests.mjs
      - name: Run fixed Python SQLite and Java filesystem pilots
        run: python examples/engineering/run-pilots.py "$RUNNER_TEMP/engineering-artifacts" "$GITHUB_WORKSPACE/dependencies"
      - name: Independently authored report and SQLite regression probes
        env:
          PYTHONPATH: examples/engineering/python
          QA_STORE_IMPLEMENTATION: store
        run: |
          node tests/engineering/independent-probes.mjs --repo-root . --artifact-root "$RUNNER_TEMP/engineering-artifacts/qa-probes" --out "$RUNNER_TEMP/engineering-artifacts/qa-probes.json" --candidate-revision "$GITHUB_SHA"
          python -m pytest -q -c examples/engineering/python/pytest.ini tests/engineering/independent_store.py --junitxml="$RUNNER_TEMP/engineering-artifacts/independent-sqlite.xml"
      - name: Normalize actual reports and inspect both current traceability groups
        run: |
          python examples/engineering/prepare-reports.py "$RUNNER_TEMP/engineering-artifacts"
          node scripts/engineering-report.mjs normalize --manifest python-manifest.json --junit python.xml --report-root "$RUNNER_TEMP/engineering-artifacts" --out python-run.json
          node scripts/engineering-report.mjs summary --trace python-trace.json --run python-run.json --versions python-versions.json --report-root "$RUNNER_TEMP/engineering-artifacts" --out python-summary.json --html python-summary.html
          node scripts/engineering-report.mjs normalize --manifest java-manifest.json --junit java.xml --report-root "$RUNNER_TEMP/engineering-artifacts" --out java-run.json
          node scripts/engineering-report.mjs summary --trace java-trace.json --run java-run.json --versions java-versions.json --report-root "$RUNNER_TEMP/engineering-artifacts" --out java-summary.json --html java-summary.html
          node examples/engineering/verify-incomplete.mjs "$RUNNER_TEMP/engineering-artifacts"
          python tests/engineering/validate-schemas.py "$RUNNER_TEMP/engineering-artifacts"
      - name: Preserve original reports, failures, coverage, receipts and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/engineering-artifacts
          if-no-files-found: warn
          retention-days: 14
