name: PADF V0.3 specialist design validation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - '.agents/**'
      - 'contracts/**'
      - 'workflow/**'
      - 'governance/**'
      - 'integrations/**'
      - 'lib/**'
      - 'tests/v0.3/**'
      - 'tests/vnext/**'
      - 'standards/**'
      - 'docs/upgrades/**'
      - 'scripts/**'
      - 'templates/**'
      - 'examples/**'
      - '.github/workflows/v0.3-design-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural references and contract markers
        run: node scripts/validate-cacf.mjs
      - name: Design gate and tests syntax
        run: |
          node --check lib/design-gate.mjs
          node --check tests/v0.3/run-tests.mjs
          node --check lib/orchestration-evidence.mjs
          node --check lib/skill-delivery-quality.mjs
          node --check tests/v0.3/run-orchestration-tests.mjs
          node --check tests/v0.3/run-skill-quality-tests.mjs
      - name: Specialized agent routing and dependency tests
        run: node tests/v0.3/run-tests.mjs
      - name: Master orchestration dispatch provenance fixture tests
        run: node tests/v0.3/run-orchestration-tests.mjs
      - name: Independent Owner quality sheet metadata tests
        run: node tests/v0.3/run-skill-quality-tests.mjs
      - name: Product scope, dependency and shared protocol tests
        run: node tests/v0.3/run-product-tests.mjs
      - name: Two-phase specs and concept Mockup regressions
        run: node tests/v0.3/run-feedback-tests.mjs
      - name: Concept confirmation, frontend Mockup and Impeccable regressions
        run: node tests/v0.3/run-concept-mockup-tests.mjs
      - name: G-01 action preflight and lifecycle regressions
        run: node tests/v0.3/run-preflight-tests.mjs
      - name: Master progress reconciliation and independent QA regressions
        run: |
          node --check lib/progress-reconciliation.mjs
          node tests/v0.3/run-progress-tests.mjs
          node tests/v0.3/run-progress-qa-tests.mjs
      - name: Review, multi-stage, orchestration binding and UI integrity regressions
        run: node tests/v0.3/run-review-integrity-tests.mjs
      - name: Master-led expense pilot dependency and artifact checks
        run: node tests/v0.3/verify-expense-pilot.mjs
      - name: Architecture Profile behavior and unchanged Gate controls
        run: node tests/vnext/run-profile-tests.mjs
      - name: Terminology source, contextual hints and protected content
        run: |
          node scripts/build-glossary.mjs --check
          node tests/vnext/run-terminology-tests.mjs
      - name: Architecture sample model and source consistency
        run: |
          python3 examples/architecture-method/tools/check.py
          python3 tests/vnext/run-diagram-source-tests.py
